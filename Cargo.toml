[package]
name = "tenth"
version = "0.1.0"
edition = "2024"
description = "Tenth — precise, calm time tracking for billable work"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
